# Path-based risk tiers for the review-guard (TWO-5879), and the human
# risk-tiered review map for this repo (owner-approved risk-tiered review,
# policy in the adopting parent card's "plan" document).
#
# Runtime contract (parsed by src/review-tiers.ts — unknown top-level keys
# throw, so the machine-readable lists below stay exactly low/ordinary/
# sensitive; the human policy is documented in these comments):
#   - QA reviews every change; Security is added for sensitive or
#     unclassified paths. Sensitive wins when lists overlap.
#   - A PR's tier is the HIGHEST tier of any changed file
#     (sensitive > ordinary > low). A file matching no glob below
#     defaults to sensitive. Editing this file itself is always
#     sensitive, whatever the map says.
#
# Human classification rules (restated from the bootstrap map):
#   1. Content triggers escalate to sensitive regardless of path:
#      new/changed public endpoint or input parsing; auth/authz/session
#      logic; crypto or key handling; secrets/credentials; permission
#      checks; tenant-isolation or personal-data handling; SQL/schema/
#      migrations; dependency or lockfile changes; CI/workflow changes;
#      weakened test assertions, deleted tests/snapshots, or lowered
#      gates in test files (so test paths are low only for additive tests).
#   2. The author records the tier in the PR attestation (`risk_tier`);
#      QA verifies it against this file and the diff. Any doubt
#      escalates. QA may pull in Security on any PR.
#   3. Review per tier: low -> QA; ordinary -> QA;
#      sensitive/unclassified -> Security -> QA.
#   4. This file itself, and any change to it, is always sensitive
#      (review-policy enforcement). No glob in the sensitive floor may
#      be moved to low/ordinary without the Security Engineer's
#      approval recorded on that PR.
#
# Sensitive floor (never downgraded): CI/workflows, this file, CODEOWNERS;
# dependency manifests and lockfiles (incl. dev deps), build tools and
# install scripts; auth/session/crypto/secrets, public endpoints and input
# parsing, tenant isolation, personal data, DB schema/migrations;
# runtime/network/IAM config, infra and deploy/release paths; agent
# instructions/skills/tool permissions. Every new top-level path is
# sensitive until explicitly classified here.
#
# Low is allowlist-only: docs copy, static non-sensitive fixtures,
# additive unit tests (content triggers still apply).
# Ordinary is audited modules only: bounded behaviour change with no
# untrusted input, no sensitive output, no permissions, no persistence,
# no trust-boundary effect. Anything unlisted is sensitive by default —
# when in doubt, leave it unlisted.
#
# Runtime tier lists (the plugin's read-only copy of the policy above —
# classifying a path lower here than the policy allows requires the
# Security Engineer approval in rule 4):
low:
  - "**/*.md"
  - "LICENSE"
ordinary:
  - "src/ui/**"
  - "src/*.test.ts"
  - "bin/**"
sensitive:
  - "src/review-guard.ts"
  - "src/review-tiers.ts"
  - "src/config.ts"
  - "src/manifest.ts"
  - "src/github*.ts"
  - "src/*scan*.ts"
  - ".github/**"
  - "package*.json"
  - "scripts/**"
