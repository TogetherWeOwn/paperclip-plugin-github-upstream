name: package-metadata-policy
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  merge-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify event revision and test metadata policy
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --version
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --test scripts/package-metadata-policy.test.mjs
  head:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify head revision and test metadata policy
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --version
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --test scripts/package-metadata-policy.test.mjs
