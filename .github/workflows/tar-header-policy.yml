# Review draft only; move to workflows only with the reviewed slice.
name: tar-header-policy
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  merge-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record and verify event revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 --version
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check selected header fields
        run: python3 -I scripts/tar-header-policy.test.py
  header-policy:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record runtime and revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 --version
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check selected header fields
        run: python3 -I scripts/tar-header-policy.test.py
