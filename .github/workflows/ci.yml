name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Required status check on main. Renaming this changes the check context
    # and blocks every merge until the ruleset is updated to match.
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify inert parser remains disconnected
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/review-tier-map-v1.js
          test -f dist/review-tier-map-v1.d.ts
          if git grep -n -F 'review-tier-map-v1' -- . \
            ':(exclude)src/**/*.test.ts' \
            ':(exclude)src/review-tier-map-v1.ts' \
            ':(exclude).github/workflows/ci.yml'; then
            printf '%s\n' 'Unexpected production source reference to the inert parser'
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi
          if grep -R -n -F 'review-tier-map-v1' dist \
            --exclude=review-tier-map-v1.js --exclude=review-tier-map-v1.d.ts; then
            printf '%s\n' 'Unexpected build output reference to the inert parser'
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi
