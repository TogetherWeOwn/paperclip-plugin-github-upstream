name: Package reviewed candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed source commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify candidate pin
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$SOURCE_SHA" = 35a0c2ed0148c6cdfecd3c38c0cef726862294ae
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 35a0c2ed0148c6cdfecd3c38c0cef726862294ae
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build and pack exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm ci --ignore-scripts
          npm run check
          mkdir "$RUNNER_TEMP/candidate"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/candidate" > "$RUNNER_TEMP/candidate/pack.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  validate:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 35a0c2ed0148c6cdfecd3c38c0cef726862294ae
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Independently rebuild reviewed source
        working-directory: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$SOURCE_SHA" = 35a0c2ed0148c6cdfecd3c38c0cef726862294ae
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm ci --ignore-scripts
          npm run build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Validate and retain
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node tooling/scripts/retain-package.mjs "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/validated"
      - name: Upload validated package and provenance
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validated/
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: Record artifact receipt
        env:
          ARTIFACT_ID: ${{ steps.package.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.package.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.package.outputs.artifact-digest }}
        run: |
          test -n "$ARTIFACT_ID" && test -n "$ARTIFACT_URL" && test -n "$ARTIFACT_DIGEST"
          printf 'Artifact ID: `%s`\n\nURL: %s\n\nService digest: `%s`\n\nVerify actual expiry via artifact API; successful run and independent release acceptance are required.\n' "$ARTIFACT_ID" "$ARTIFACT_URL" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
